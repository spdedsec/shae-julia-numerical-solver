name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: '1.10'
      - name: Test
        run: make test
      - name: Create release
        run: |
          make release
          gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes "SHAE Julia Numerical Solver" dist/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
